<!DOCTYPE html>
<html lang="sv" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSense.UI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Typsnitten som Main.css redan refererar via --font-family-*. Utan dessa
         faller allt tillbaka på systemets serif/sans-serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/Main.css" />
    <link href="EduSense.UI.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Ett oväntat fel har inträffat.
        <a href="." class="reload">Ladda om</a>
        <button type="button" class="dismiss" aria-label="Stäng felmeddelande">🗙</button>
    </div>
    <script src="js/focusTrap.js"></script>
    <script src="js/backToTop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
